<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人專屬翻譯悄悄話 ❤️</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg-color: #FFF2F2; --primary-color: #FF7597; --secondary-color: #FFB3C6; --text-dark: #4A4A4A; --bubble-me: #FF85A2; --bubble-you: #FFFFFF; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-color); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .phone-container { width: 100%; max-width: 450px; height: 100vh; background: #FFF9F9; display: flex; flex-direction: column; position: relative; }
        .app-header { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; padding: 12px 15px; text-align: center; position: relative; }
        .app-title-cn { font-weight: bold; font-size: 1.05rem; }
        .app-title-th { font-size: 0.85rem; opacity: 0.9; }
        
        /* 🔔 新增通知按鈕樣式 */
        .noti-btn { position: absolute; left: 10px; top: 12px; background: rgba(255,255,255,0.25); border: none; color: white; padding: 4px 8px; border-radius: 10px; font-size: 0.65rem; cursor: pointer; font-weight: bold; }
        
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg-row { display: flex; width: 100%; gap: 8px; align-items: flex-start; }
        .msg-row.mine { flex-direction: row-reverse; }
        .msg-content-area { display: flex; flex-direction: column; max-width: 75%; }
        .mine .msg-content-area { align-items: flex-end; }
        .sender-name { font-size: 0.72rem; color: #777777; margin-bottom: 3px; }
        .msg-bubble { padding: 11px 15px; border-radius: 18px; font-size: 0.95rem; word-break: break-word; }
        .mine .msg-bubble { background: var(--bubble-me); color: white; border-top-right-radius: 4px; }
        .yours .msg-bubble { background: var(--bubble-you); color: var(--text-dark); border-top-left-radius: 4px; border: 1px solid #FFE4E9; }
        .trans-block { font-size: 0.85rem; margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.4); }
        .yours .trans-block { border-top: 1px dashed #FFE4E9; color: #555555; }
        .loading-trans { font-size: 0.75rem; opacity: 0.6; font-style: italic; }
        .check-trans { font-size: 0.72rem; opacity: 0.75; margin-top: 4px; display: block; }
        .input-container { background: white; padding: 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #FFE4E9; }
        #userInput { flex: 1; padding: 10px 16px; border: 1px solid #FFD0DA; border-radius: 20px; outline: none; }
        #sendBtn { background: var(--primary-color); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        .setup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .setup-box { background: white; padding: 25px; border-radius: 24px; width: 85%; max-width: 340px; text-align: center; }
        .setup-input { width: 100%; padding: 10px 15px; border: 1px solid #FFD0DA; border-radius: 15px; margin-top: 10px; margin-bottom: 20px; text-align: center; }
        .setup-btn { background: var(--primary-color); color: white; border: none; padding: 10px 24px; border-radius: 15px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div id="setupModal" class="setup-overlay" style="display: none;">
    <div class="setup-box">
        <h3 style="margin:0; color:var(--primary-color);">💕 設定名字 / ตั้งค่าชื่อ</h3>
        <input type="text" id="nameInput" class="setup-input" placeholder="輸入名字 / พิมพ์ชื่อของคุณ">
        <button class="setup-btn" onclick="saveProfile()">開啟悄悄話 🚀</button>
    </div>
</div>

<div class="phone-container">
    <div class="app-header">
        <button class="noti-btn" onclick="requestNotificationPermission()">開啟通知<br><span style="font-size:7px;font-weight:normal;">เปิดแจ้งเตือน</span></button>
        <div class="app-title-cn">💕 我們的專屬小窩</div>
        <div class="app-title-th">ห้องแชทส่วนตัวของเรา</div>
    </div>
    <div id="chat-window"></div>
    <div class="input-container">
        <input type="text" id="userInput" placeholder="寫啲嘢呀... / พิมพ์ข้อความ...">
        <button id="sendBtn" onclick="handleSend()">✈️</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyADZjXliTZRKV3-3rGwviIcTFnvIFT6-jw",
        authDomain: "toey-97851.firebaseapp.com",
        databaseURL: "https://toey-97851-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "toey-97851",
        storageBucket: "toey-97851.firebasestorage.app",
        messagingSenderId: "992431375724",
        appId: "1:992431375724:web:9c17be2184113892845f49"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let USER_NAME = localStorage.getItem('chat_user_name') || "";
    if (!USER_NAME) document.getElementById('setupModal').style.display = 'flex';

    function saveProfile() {
        const name = document.getElementById('nameInput').value.trim();
        if (!name) return;
        USER_NAME = name;
        localStorage.setItem('chat_user_name', USER_NAME);
        document.getElementById('setupModal').style.display = 'none';
    }

    // 🔔 請求通知權限函數
    function requestNotificationPermission() {
        if (!("Notification" in window)) {
            alert("此手機瀏覽器不支援網頁通知功能功能。");
            return;
        }
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                alert("🎉 通知功能已成功開啟！");
            } else {
                alert("⚠️ 通知權限被拒絕，請去手機系統設定允許瀏覽器通知。");
            }
        });
    }

    async function fetchTranslation(systemPrompt, userText) {
        const response = await fetch("/api/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ systemPrompt, userText })
        });
        if (!response.ok) throw new Error("Server Error");
        const data = await response.json();
        return data.result;
    }

    async function doAITranslation(text) {
        const isThai = /[\u0E00-\u0E7F]/.test(text);
        const promptTrans = isThai 
            ? "You are an expert translator. Translate the following Thai text into Natural, Colloquial Traditional Chinese (Hong Kong/Cantonese style). Only output the final translated text, nothing else."
            : "You are an expert translator. Translate the following Chinese/Cantonese text into Natural, Colloquial Thai. Only output the final translated text, nothing else.";
        const promptVerify = isThai
            ? "You are an expert translator. Translate the following Chinese text back into natural Thai. Only output the final text."
            : "You are an expert translator. Translate the following Thai text back into Natural Traditional Chinese (Hong Kong style). Only output the final text.";

        try {
            const translated = await fetchTranslation(promptTrans, text);
            const verified = await fetchTranslation(promptVerify, translated);
            return { translated, verified };
        } catch (e) {
            return { translated: "翻譯失敗，請再試一次", verified: "無法驗證" };
        }
    }

    async function handleSend() {
        const text = document.getElementById('userInput').value.trim();
        if (!text) return;
        document.getElementById('userInput').value = '';
        
        const newMsgRef = db.ref('messages').push();
        newMsgRef.set({
            sender: USER_NAME,
            original: text,
            translated: "loading",
            verified: "",
            timestamp: Date.now()
        });

        doAITranslation(text).then((result) => {
            newMsgRef.update({
                translated: result.translated,
                verified: result.verified
            });
        });
    }

    // 🔔 判斷是否為網頁初次加載，防止一進網頁就被舊訊息瘋狂轟炸通知
    let isInitialLoad = true;
    db.ref('messages').limitToLast(1).once('value', () => { isInitialLoad = false; });

    db.ref('messages').limitToLast(15).on('child_added', (snapshot) => { renderMessage(snapshot); });
    db.ref('messages').limitToLast(15).on('child_changed', (snapshot) => {
        const key = snapshot.key;
        const bubble = document.getElementById(`msg-${key}`);
        if (bubble) {
            const msg = snapshot.val();
            const placeholder = bubble.querySelector('.trans-placeholder');
            if (placeholder && msg.translated !== "loading") {
                placeholder.innerHTML = `
                    <div class="trans-block">
                        <strong>✨ AI 譯 / แปล:</strong> ${msg.translated}
                        <span class="check-trans">🔄 反向驗證: ${msg.verified}</span>
                    </div>
                `;
            }
        }
    });

    function renderMessage(snapshot) {
        const msg = snapshot.val();
        const key = snapshot.key;
        if (document.getElementById(`msg-${key}`)) return;

        const chatWindow = document.getElementById('chat-window');
        const isMe = msg.sender === USER_NAME;

        const row = document.createElement('div');
        row.className = `msg-row ${isMe ? 'mine' : 'yours'}`;
        row.id = `msg-${key}`;

        const contentArea = document.createElement('div');
        contentArea.className = 'msg-content-area';

        const nameLabel = document.createElement('div');
        nameLabel.className = 'sender-name';
        nameLabel.innerText = msg.sender;
        contentArea.appendChild(nameLabel);

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        
        let html = `<div>${msg.original}</div><div class="trans-placeholder">`;
        if (msg.translated === "loading") {
            html += `<span class="loading-trans">⏳ AI 正在翻譯...</span>`;
        } else {
            html += `
                <div class="trans-block">
                    <strong>✨ AI 譯 / แปล:</strong> ${msg.translated}
                    <span class="check-trans">🔄 反向驗證: ${msg.verified}</span>
                </div>
            `;
        }
        html += `</div>`;
        
        bubble.innerHTML = html;
        contentArea.appendChild(bubble);
        row.appendChild(contentArea);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        // 🔔 核心通知發送邏輯
        if (!isInitialLoad && !isMe && Notification.permission === "granted") {
            new Notification(`💕 ${msg.sender} :`, {
                body: msg.original,
                icon: 'https://cdn-icons-png.flaticon.com/512/3641/3641323.png'
            });
        }
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
